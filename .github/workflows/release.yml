name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          # A head push authenticated with `github.token` (the v4 default)
          # is attributed to `github-actions[bot]`, which GitHub treats as an
          # outside collaborator: the release PR's CI run is held at
          # `action_required` with 0 jobs until a human approves it. The org
          # PAT acts as a collaborator, so its runs start on their own. Same
          # choice dcc-mcp-core and dcc-mcp-autocad already make.
          #
          # No `|| github.token` fallback: a missing or renamed secret must
          # fail the release loudly rather than silently restore the manual
          # approval gate.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
